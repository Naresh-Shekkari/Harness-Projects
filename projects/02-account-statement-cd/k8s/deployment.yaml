apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-statement-service
  namespace: default
  labels:
    app: account-statement-service
    tier: backend
    domain: retail-banking
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: account-statement-service
  template:
    metadata:
      labels:
        app: account-statement-service
    spec:
      containers:
        - name: account-statement-service
          image: naresh6961/account-statement-service:<+artifact.tag>
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/statements/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/statements/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
